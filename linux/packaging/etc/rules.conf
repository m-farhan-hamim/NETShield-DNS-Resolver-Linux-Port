# NetShield custom rules - apply with:  sudo netshield reload
#
#   block <domain>          sinkhole the domain and every subdomain
#   allow <domain>          never block the domain or its subdomains (beats block rules and lists)
#   map <domain> <ip>       answer exactly <domain> with this IPv4/IPv6 address
#
# Examples (remove the leading # to enable):
#
# block doubleclick.net
# block *.telemetry.example.com
# allow connectivitycheck.gstatic.com
# map nas.home 192.168.1.100
# map router.lan 192.168.1.1
