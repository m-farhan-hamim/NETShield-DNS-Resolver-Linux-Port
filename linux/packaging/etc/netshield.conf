# NetShield DNS Resolver - main configuration
# Edit, then apply with:  sudo netshield reload
# (changes to listen_address / port need:  sudo systemctl restart netshield-dns)

# ---- Listener --------------------------------------------------------------
# Address and port the resolver answers on (UDP and TCP).
# Default is loopback only. Setting 0.0.0.0 makes this an open resolver for
# everything that can reach the machine - only do that on a trusted LAN, and
# ideally restrict it with a firewall.
listen_address=127.0.0.1
# 5335 avoids clashing with systemd-resolved (:53 on 127.0.0.53) and mDNS (:5353).
# To serve on port 53 (the service is allowed to bind it), first free the port,
# e.g. set DNSStubListener=no in /etc/systemd/resolved.conf.
port=5335
worker_threads=32

# ---- Upstream --------------------------------------------------------------
# DOH = DNS-over-HTTPS, DOT = DNS-over-TLS, UDP = plain DNS
upstream_mode=DOH
doh_url=https://cloudflare-dns.com/dns-query
dot_host=dns.google
dot_port=853
# Used when upstream_mode=UDP. Plain "ip" means port 53; "ip:port" is also accepted.
upstream_primary=1.1.1.1
upstream_secondary=8.8.8.8
# If DoH/DoT fails, retry over plain, unencrypted UDP so the network keeps working.
# Set to false if you would rather fail than ever send a query in the clear.
fallback_udp=true
fallback_primary=1.1.1.1
fallback_secondary=8.8.8.8
# NOTE: DoH/DoT server names (cloudflare-dns.com, dns.google) are themselves
# looked up through the system resolver. If you point this machine's own
# /etc/resolv.conf at NetShield, use an IP-literal doh_url such as
# https://1.1.1.1/dns-query, or a dot_host given as an IP, to avoid a loop.

# ---- Blocking --------------------------------------------------------------
# ZERO_IP  = answer 0.0.0.0 / :: for blocked names
# NXDOMAIN = answer "no such domain"
block_action=ZERO_IP

# ---- Cache -----------------------------------------------------------------
cache_enabled=true
cache_size=2000

# ---- Per-client policy (the Android app's "Hotspot" tab) --------------------
# Comma-separated client IPs whose queries are always sinkholed.
blocked_clients=
# Daily query caps, 0 = unlimited. daily_query_limit counts all clients together;
# client_daily_limit is per client IP. Counters reset at local midnight.
daily_query_limit=0
client_daily_limit=0
# Domains in trusted.list bypass blocking AND these limits.

# ---- Blocklist downloads ----------------------------------------------------
# Lists come from sources.list. Re-download every N hours (0 = only on
# "netshield sync"). The first download happens shortly after first start.
sync_interval_hours=24

# ---- Query log ---------------------------------------------------------------
# One line per query in /var/log/netshield/queries.log (readable by root and the
# netshield group only). Set to false to keep no query history at all.
log_queries=true
# Rotate to queries.log.1 once the file exceeds this size.
log_max_mb=10

# ---- Paths (normally leave alone) ---------------------------------------------
# rules.conf, sources.list and trusted.list are read from the same directory
# as this file.
state_dir=/var/lib/netshield
log_dir=/var/log/netshield
control_socket=/run/netshield/control.sock
